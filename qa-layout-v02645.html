<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>装备布局回归检查</title><link rel="stylesheet" href="./game.bundle.css?v=0.26.45"><style>:root{--companion-unit:58px}body{padding:0}.game-shell{width:min(390px,100%)}#test-controls{display:flex;gap:8px;padding:8px}#test-controls button{padding:10px}#test-view{overflow:auto;flex:1}.crew-view{padding:12px}</style><div class="game-shell"><nav id="test-controls"><button data-view="equipment">装备</button><button data-view="bag">背包</button><button data-view="formation">阵容</button></nav><main id="test-view"></main></div><script type="module">
import {initialState,CATS} from './core.mjs';import {addGear,equipGear,RUNES} from './equipment.mjs';import {crewEquipmentHTML,inventoryHTML} from './inventory-ui.mjs';import {crewFormationHTML} from './crew-formation.mjs';import {setPose} from './art.mjs';import {companionSize} from './companion-display.mjs';
const s=initialState();s.roster.owned=CATS.map(c=>c.id);s.party=['orange','pudding','ink',null,null];for(const rune of RUNES)addGear(s,60,{slot:'rune',rune:rune.id,quality:2});const e=s.inventory.items.find(x=>x.slot==='rune');equipGear(s,e.id,'pudding',s.roster.owned);for(const set of ['hunt','guard','ember','spring','clock','thorn'])for(const slot of ['claw','coat','collar','brace'])addGear(s,60,{slot,set,quality:1});
function show(view){document.querySelector('#test-view').innerHTML=view==='bag'?inventoryHTML(s,{tab:'equipment'}):'<div class="crew-view" data-mode="'+view+'">'+(view==='formation'?crewFormationHTML(s):crewEquipmentHTML(s,'pudding',{}))+'</div>';document.querySelectorAll('image[data-asset]').forEach(e=>e.setAttribute('href',e.dataset.asset));}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));show('equipment');function frame(t){for(const sprite of document.querySelectorAll('.companion-body'))setPose(sprite,0,{time:t/1000,idleTime:t/1000,renderSize:companionSize(58,sprite.dataset.art)});requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
