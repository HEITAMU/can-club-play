<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8d4a5">
<meta name="description" content="四格诡局：转动四格，复原星图。">
<meta name="fourfold-version" content="0.8.1">
<title>四格诡局 · 星图挑战</title>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="preload" as="image" href="assets/art/home-scene.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/art/ui-atlas.webp">
<link rel="stylesheet" href="assets/art/atlas.css?v=0.8.1">
<link rel="stylesheet" href="style.css?v=0.8.1">
<link rel="stylesheet" href="reference.css?v=0.8.1">
</head>
<body>
<main class="shell" id="app" data-build="0.8.1">
<section id="home" class="home-screen" aria-label="四格诡局主菜单">
<h1 class="sr-only">四格诡局</h1>
<div class="home-hero"><img class="home-scene" src="assets/art/home-scene.webp" width="854" height="1840" alt="夜色星窗前摊开的星图手册" fetchpriority="high" draggable="false"></div>
<button id="homeSettings" class="icon-button home-settings" aria-label="设置"><span class="skin skin-settingsButton" aria-hidden="true"></span></button>
<div class="cozy-menu" aria-label="主菜单">
<button id="enterStory" class="art-button" onclick="window.ffOpen&&window.ffOpen('story')"><span class="skin skin-goldButton" aria-hidden="true"></span><span class="button-label"><span class="menu-symbol">✧</span>进入星图</span></button>
<button id="enterDaily" class="art-button" onclick="window.ffOpen&&window.ffOpen('daily')"><span class="skin skin-creamButton" aria-hidden="true"></span><span class="button-label"><span class="menu-symbol">◇</span>每日挑战</span></button>
<button id="enterRank" class="art-button" onclick="window.ffOpen&&window.ffOpen('rank')"><span class="skin skin-lavenderButton" aria-hidden="true"></span><span class="button-label"><span class="menu-symbol crown">♛</span>好友荣誉榜</span></button>
</div>
</section>
<div id="gameScreen" class="game-screen" data-mode="story" hidden>
<header class="compact-top">
<button id="backHome" class="icon-button" aria-label="返回主界面"><span class="skin skin-backButton" aria-hidden="true"></span></button>
<h1 id="stageTitle" class="stage-title skin-creamButton">第1关</h1>
<button id="settingsBtn" class="icon-button" aria-label="设置"><span class="skin skin-settingsButton" aria-hidden="true"></span></button>
</header>
<div id="dailyBanner" class="daily-banner" aria-label="每日挑战" hidden><span class="banner-skin" aria-hidden="true"></span><div class="daily-copy"><strong id="dailyDate"></strong><span>每日挑战</span></div></div>
<nav class="mode-select" hidden aria-hidden="true"><button id="storyTab">闯关</button><button id="dailyTab">每日挑战</button></nav>
<section class="game-panel" aria-label="星图关卡">
<div class="game-topline" hidden><span id="difficulty"></span><span id="chapterCaption"></span><span id="puzzleTitle"></span></div>
<div class="metric-row">
<div class="stat-card"><span class="skin skin-stepsCard" aria-hidden="true"></span><div class="stat-copy"><small>当前步数</small><strong id="moves">00</strong></div></div>
<div hidden><strong id="par"></strong></div>
<div class="stat-card"><span class="skin skin-timeCard" aria-hidden="true"></span><div class="stat-copy"><small>本局用时</small><strong id="clock">00:00</strong></div></div>
</div>
<div id="target" class="target" hidden></div>
<div class="board-frame"><div id="board" class="board" role="group" aria-label="九宫格星图"></div><div id="anchors" class="anchors" aria-label="旋转节点"></div></div>
<p class="instruction sr-only" id="instruction" aria-live="polite"></p>
<div class="direction" aria-label="旋转方向">
<button id="cwBtn" class="art-button selected"><span class="skin skin-creamButton" aria-hidden="true"></span><span class="button-label"><span class="direction-symbol">↻</span>顺时针</span></button>
<button id="ccwBtn" class="art-button"><span class="skin skin-creamButton" aria-hidden="true"></span><span class="button-label"><span class="direction-symbol">↺</span>逆时针</span></button>
</div>
<div class="tools"><button id="hintBtn" class="art-button"><span class="skin skin-creamButton" aria-hidden="true"></span><span class="button-label">✧ 提示</span></button></div>
</section>
<div class="bottom-actions"><button class="art-button" id="shareBtn"><span class="skin skin-goldButton" aria-hidden="true"></span><span class="button-label">✧ 发起同关挑战</span></button><button id="nextBtn" hidden></button></div>
</div>
</main>
<div id="settingsOverlay" class="settings-overlay" hidden><section class="settings-card" role="dialog" aria-modal="true" aria-label="游戏设置"><div class="settings-head"><h2>设置</h2><button id="settingsClose" class="close" aria-label="关闭设置">×</button></div><button id="settingsSound">音乐与音效：开</button><button id="settingsReset">重开本局</button><button id="settingsHome">返回主界面</button></section></div>
<div class="overlay" id="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><button id="closeModal" class="close" aria-label="关闭弹窗">×</button><div class="dialog-emblem" id="dialogEmblem">✦</div><div id="dialogOverline" hidden></div><h2 id="dialogTitle">星图已复原</h2><p id="dialogText"></p><div class="dialog-stats" id="dialogStats"></div><button id="dialogPrimary" class="sprite-button skin-goldButton">继续挑战</button><button id="dialogSecondary" class="result-share-btn sprite-button skin-creamButton">分享我的成绩</button></section></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="startupNotice" hidden role="status"></div>
<noscript>请启用 JavaScript 进入星图。</noscript>
<script>window.ffOpen=function(which){window.ffPending=which;var n=document.getElementById('startupNotice');n.hidden=false;n.textContent='星图正在准备…';};</script>
<script type="module" src="layout.mjs?v=0.8.1"></script>
<script type="module" src="app.js?v=0.8.1"></script>
</body></html>
