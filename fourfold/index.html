<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8d4a5">
<meta name="description" content="四格诡局：转动四格，复原星图。">
<meta name="fourfold-version" content="0.8.15">
<title>四格诡局 · 星图挑战</title>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="preload" as="image" href="assets/art/home-celestial-v3.webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/art/home-menu-v3.webp">
<link rel="preload" as="image" href="assets/art/ui-atlas.webp">
<link rel="stylesheet" href="assets/art/atlas.css?v=0.8.15">
<link rel="stylesheet" href="style.css?v=0.8.15">
<link rel="stylesheet" href="reference.css?v=0.8.15">
</head>
<body>
<main class="shell" id="app" data-build="0.8.15">
<section id="home" class="home-screen" aria-label="四格诡局主菜单">
<div class="home-hero">
<img class="home-scene" src="assets/art/home-celestial-v3.webp" width="1173" height="1341" alt="金色月牙、紫色云海、行星与星座组成的星空" fetchpriority="high" draggable="false">
<h1 id="homeTitle" class="home-title">四格诡局</h1>
<p id="homeSubtitle" class="home-subtitle" aria-hidden="true">FOURFOLD</p>
</div>
<button id="homeSettings" class="icon-button home-settings" aria-label="设置"><span class="skin skin-settingsButton" aria-hidden="true"></span></button>
<div class="cozy-menu" aria-label="主菜单">
<button id="enterStory" class="art-button" onclick="window.ffOpen&&window.ffOpen('story')"><span class="home-menu-skin" aria-hidden="true"></span><span class="button-label"><span id="homeStoryText">开始解谜</span></span></button>
<button id="enterDaily" class="art-button" onclick="window.ffOpen&&window.ffOpen('daily')"><span class="home-menu-skin" aria-hidden="true"></span><span class="button-label">每日挑战</span></button>
<button id="enterRank" class="art-button" onclick="window.ffOpen&&window.ffOpen('rank')"><span class="home-menu-skin" aria-hidden="true"></span><span class="button-label">好友荣誉榜</span></button>
</div>
</section>
<div id="gameScreen" class="game-screen" data-mode="story" hidden>
<header class="compact-top">
<button id="backHome" class="icon-button" aria-label="返回主界面"><span class="skin skin-backButton" aria-hidden="true"></span></button>
<h1 id="stageTitle" class="stage-title skin-creamButton">第1关</h1>
<button id="settingsBtn" class="icon-button" aria-label="设置"><span class="skin skin-settingsButton" aria-hidden="true"></span></button>
</header>
<div id="dailyBanner" class="daily-banner" aria-label="每日挑战" hidden><span class="banner-skin" aria-hidden="true"></span><div class="daily-copy"><strong id="dailyDate"></strong><span>每日挑战</span></div></div>
<nav class="mode-select" hidden aria-hidden="true"><button id="storyTab">闯关</button><button id="dailyTab">每日挑战</button></nav>
<section class="game-panel" aria-label="星图关卡">
<div class="game-topline" hidden><span id="difficulty"></span><span id="chapterCaption"></span><span id="puzzleTitle"></span></div>
<div class="metric-row">
<div class="stat-card"><span class="skin skin-stepsCard" aria-hidden="true"></span><div class="stat-copy"><small>当前步数</small><strong id="moves">00</strong></div></div>
<div hidden><strong id="par"></strong></div>
<div class="stat-card"><span class="skin skin-timeCard" aria-hidden="true"></span><div class="stat-copy"><small>本局用时</small><strong id="clock">00:00</strong></div></div>
</div>
<div id="target" class="target" hidden></div>
<div id="boardFrame" class="board-frame"><div id="board" class="board" role="group" aria-label="九宫格星图"></div><div id="turnFocus" class="turn-focus" aria-hidden="true" hidden></div><div id="anchors" class="anchors" aria-label="旋转节点"></div><img id="completeArt" class="complete-art" alt="完整星图" draggable="false" hidden><div id="themeStatus" class="theme-status" hidden role="status" aria-live="polite"><span id="themeStatusText">星图正在展开…</span><button id="themeRetry" type="button" hidden>重试</button></div></div>
<p class="instruction sr-only" id="instruction" aria-live="polite"></p>
<div id="playDirection" class="direction" aria-label="旋转方向">
<button id="cwBtn" class="art-button selected"><span class="skin skin-creamButton" aria-hidden="true"></span><span class="button-label"><span class="direction-symbol">↻</span>顺时针</span></button>
<button id="ccwBtn" class="art-button"><span class="skin skin-creamButton" aria-hidden="true"></span><span class="button-label"><span class="direction-symbol">↺</span>逆时针</span></button>
</div>
<div id="playTools" class="tools"><button id="hintBtn" class="art-button" type="button" aria-label="提示，剩余 5 次，本局最多 5 次"><span class="skin skin-creamButton" aria-hidden="true"></span><span id="hintLabel" class="button-label">✧ 提示 5/5</span><span id="hintRemaining" class="hint-remaining" aria-hidden="true">5/5</span></button><button id="numbersBtn" class="art-button" type="button" aria-pressed="true"><span class="skin skin-creamButton" aria-hidden="true"></span><span id="numbersLabel" class="button-label">隐藏数字</span></button></div>
<div id="completionActions" class="completion-actions" aria-label="星图已拼合" hidden>
<button id="viewArtBtn" class="art-button" type="button" aria-pressed="false"><span class="skin skin-creamButton" aria-hidden="true"></span><span id="viewArtLabel" class="button-label">欣赏星图</span></button>
<button id="nextBtn" class="art-button" type="button"><span class="skin skin-goldButton" aria-hidden="true"></span><span id="nextLabel" class="button-label">下一关</span></button>
<button id="resultDetailsBtn" class="art-button" type="button"><span class="skin skin-creamButton" aria-hidden="true"></span><span class="button-label">成绩详情</span></button>
</div>
</section>
<div class="bottom-actions"><button class="art-button" id="shareBtn"><span class="skin skin-goldButton" aria-hidden="true"></span><span class="button-label">✧ 发起同关挑战</span></button></div>
</div>
<section id="rankScreen" class="rank-screen" aria-labelledby="rankTitle" hidden>
<h1 id="rankTitle" class="sr-only">好友荣誉榜</h1>
<div id="rankStage" class="rank-art-stage">
<img id="rankScene" class="rank-scene" src="assets/art/rank-scene.webp" width="854" height="1842" alt="" draggable="false">
<button id="rankBack" class="rank-position rank-hotspot" style="--rank-x:81.5;--rank-y:151;--rank-w:101;--rank-h:102" type="button" aria-label="返回上一页"></button>
<button id="rankSettings" class="rank-position rank-hotspot" style="--rank-x:772.5;--rank-y:151;--rank-w:101;--rank-h:102" type="button" aria-label="设置"></button>
<p id="rankDate" class="rank-position rank-date" style="--rank-x:427;--rank-y:294;--rank-w:650;--rank-h:48"></p>
<div class="rank-podium" aria-hidden="true">
<span class="rank-position rank-podium-name" style="--rank-x:427;--rank-y:653;--rank-w:220;--rank-h:48">虚位以待</span><span class="rank-position rank-podium-value" style="--rank-x:427;--rank-y:703;--rank-w:200;--rank-h:40">— 步</span><span class="rank-position rank-podium-time" style="--rank-x:427;--rank-y:743;--rank-w:200;--rank-h:40">—:—</span>
<span class="rank-position rank-podium-name" style="--rank-x:190;--rank-y:694;--rank-w:200;--rank-h:42">虚位以待</span><span class="rank-position rank-podium-value" style="--rank-x:190;--rank-y:741;--rank-w:190;--rank-h:38">— 步</span><span class="rank-position rank-podium-time" style="--rank-x:190;--rank-y:777;--rank-w:190;--rank-h:38">—:—</span>
<span class="rank-position rank-podium-name" style="--rank-x:665;--rank-y:701;--rank-w:210;--rank-h:42">虚位以待</span><span class="rank-position rank-podium-value" style="--rank-x:665;--rank-y:744;--rank-w:190;--rank-h:38">— 步</span><span class="rank-position rank-podium-time" style="--rank-x:665;--rank-y:780;--rank-w:190;--rank-h:38">—:—</span>
</div>
<section class="rank-empty" aria-label="微信好友成绩为空">
<h2 class="rank-position rank-empty-title" style="--rank-x:355;--rank-y:1024;--rank-w:260;--rank-h:58">微信好友榜</h2>
<p class="rank-position rank-empty-status" style="--rank-x:355;--rank-y:1122;--rank-w:260;--rank-h:58">暂无好友成绩</p>
<p class="rank-position rank-empty-help" style="--rank-x:355;--rank-y:1220;--rank-w:260;--rank-h:78"><span>在微信小游戏中<br>查看好友成绩</span></p>
</section>
<button id="rankPrev" class="rank-position rank-hotspot rank-page-hotspot" style="--rank-x:310.5;--rank-y:1301.5;--rank-w:53;--rank-h:43" type="button" aria-label="上一页好友成绩"></button>
<button id="rankNext" class="rank-position rank-hotspot rank-page-hotspot" style="--rank-x:543.5;--rank-y:1301.5;--rank-w:53;--rank-h:43" type="button" aria-label="下一页好友成绩"></button>
<p id="rankBestNote" class="rank-position rank-best-note" style="--rank-x:427;--rank-y:1368;--rank-w:310;--rank-h:24">本机暂无记录</p>
<strong id="rankBestMoves" class="rank-position rank-best-value" style="--rank-x:297;--rank-y:1538;--rank-w:220;--rank-h:86" aria-label="本机今日最佳步数">—</strong>
<strong id="rankBestTime" class="rank-position rank-best-value" style="--rank-x:659;--rank-y:1538;--rank-w:240;--rank-h:86" aria-label="本机今日最佳用时">—:—</strong>
<span class="sr-only">步数更少优先 · 同步数比用时</span>
<button id="rankDaily" class="rank-position rank-hotspot rank-daily-hotspot" style="--rank-x:428;--rank-y:1730;--rank-w:774;--rank-h:134" type="button" aria-label="挑战今日关卡"></button>
</div>
<p id="rankHintRule" class="rank-policy">每日挑战每局可用 2 次提示，成绩照常参与排行</p>
</section>
</main>
<div id="settingsOverlay" class="settings-overlay" hidden><section class="settings-card" role="dialog" aria-modal="true" aria-label="游戏设置"><div class="settings-head"><h2>设置</h2><button id="settingsClose" class="close" aria-label="关闭设置">×</button></div><button id="settingsSound">音乐与音效：开</button><button id="settingsReset">重开本局</button><button id="settingsRank">好友荣誉榜</button><button id="settingsHome">返回主界面</button></section></div>
<div class="overlay" id="modal" hidden><section id="dialogPanel" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
<img id="resultArtwork" class="result-artwork result-only" src="assets/art/result-panel.webp" width="1086" height="1448" alt="" draggable="false">
<button id="closeModal" class="close result-position" style="--result-x:874;--result-y:90;--result-w:148;--result-h:149" type="button" aria-label="关闭弹窗">×</button>
<div class="dialog-emblem" id="dialogEmblem">✦</div><div id="dialogOverline" hidden></div>
<h2 id="dialogTitle" class="result-position" style="--result-x:250;--result-y:292;--result-w:590;--result-h:100">星图已复原</h2>
<div id="resultHonor" class="result-only result-position" style="--result-x:235;--result-y:517;--result-w:620;--result-h:87"></div>
<p id="dialogText"></p><div class="dialog-stats" id="dialogStats"></div>
<p id="resultNote" class="result-only result-position" style="--result-x:220;--result-y:966;--result-w:650;--result-h:60"></p>
<button id="dialogPrimary" class="sprite-button skin-goldButton result-position" style="--result-x:130;--result-y:1082;--result-w:830;--result-h:143" type="button">继续挑战</button>
<button id="dialogSecondary" class="result-share-btn sprite-button skin-creamButton result-position" style="--result-x:248;--result-y:1256;--result-w:594;--result-h:94" type="button">分享此关给好友</button>
</section></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="startupNotice" hidden role="status"></div>
<noscript>请启用 JavaScript 进入星图。</noscript>
<script>window.ffOpen=function(which){window.ffPending=which;var n=document.getElementById('startupNotice');n.hidden=false;n.textContent='星图正在准备…';};</script>
<script type="module" src="layout.mjs?v=0.8.15"></script>
<script type="module" src="app.js?v=0.8.15"></script>
</body></html>
