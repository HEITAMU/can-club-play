<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0b1329"/><meta name="description" content="四格诡局：与朋友比一比，谁能用最少步数复原失落星图。"/>
<title>四格诡局 · 每日同题脑力挑战</title><link rel="icon" type="image/svg+xml" href="assets/icon.svg"/><link rel="stylesheet" href="style.css?v=0.2.2" />
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1329;color:#f3f0e8}
[hidden]{display:none!important}
.shell{height:100dvh;max-width:460px;margin:auto;box-sizing:border-box;overflow:hidden;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 10px)}
.home-screen{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#2c41647a,transparent 70%)}
.home-orbit{position:relative;width:min(60vw,240px);aspect-ratio:1;display:grid;place-items:center;border:1px solid #c7a6718c;border-radius:50%;margin-bottom:26px;box-shadow:0 0 0 20px #c5a36c0b,inset 0 0 55px #d8b37d17}
.home-crest{font-size:112px;color:#e5c38e;text-shadow:0 0 40px #dbb87b66}
.home-stars{position:absolute;bottom:-16px;color:#d9bd8a}
.home-title{font-size:clamp(35px,10vw,48px);font-weight:800;letter-spacing:.16em;color:#f6e8ca}
.home-subtitle{color:#c7a56e;letter-spacing:.35em;font-size:12px;margin:10px 0 18px}
.home-medal{color:#e7c68b;margin-bottom:26px}
.home-menu{width:min(100%,310px);display:grid;gap:12px}
.home-menu button{display:block;width:100%;height:54px;border:1px solid #d5b57c88;border-radius:13px;background:linear-gradient(120deg,#283b58,#17243c);color:#e9d5ae;font-size:16px;font-weight:700}
.home-menu button:first-child{background:linear-gradient(130deg,#efd6a3,#b88a56);color:#18263e}
.game-screen{height:100%;min-height:0;display:flex;flex-direction:column;gap:7px}
</style></head><body>
<div class="aurora a1"></div><div class="aurora a2"></div>
<main class="shell" id="app">
<section id="home" class="home-screen"><div class="home-orbit"><div class="home-crest">✦</div><div class="home-stars">✧　✦　✧</div></div><div class="home-title">四格诡局</div><div class="home-subtitle">F O U R F O L D</div><div class="home-medal">♛ <span id="homeProgress">01 / 18</span></div><div class="home-menu"><button id="enterStory">✦　进入星图</button><button id="enterDaily">◈　每日挑战</button><button id="enterRank">♛　好友荣誉榜</button></div></section>
<div id="gameScreen" class="game-screen" hidden>
<header class="top"><div class="brand-icon" aria-hidden="true"><span>✦</span></div><div class="brand-text"><b>FOURFOLD</b><small>四格诡局 · 星图修复局</small></div><div class="top-actions"><button id="soundBtn" class="circle-btn" aria-label="开关声音">♫</button><button id="rankBtn" class="circle-btn" aria-label="查看排行榜">♛</button></div></header>

<div class="game-nav"><button id="backHome" aria-label="返回主界面">‹</button><span>✦ 星图档案</span></div><nav class="mode-select" aria-label="关卡模式"><button id="storyTab" class="active">✦ 闯关档案</button><button id="dailyTab">◈ 每日同题 <i id="dailyDot"></i></button></nav>
<section class="game-panel"><div class="game-topline"><div><span class="caption" id="chapterCaption">ARCHIVE 01 / 18</span><h2 id="puzzleTitle">初醒的星图</h2></div><span class="difficulty" id="difficulty">入门</span></div>
<div class="metric-row"><div><small>当前步数</small><strong id="moves">00</strong></div><div><small>理论最优</small><strong id="par">--</strong></div><div><small>本局用时</small><strong id="clock">00:00</strong></div></div>
<div class="goal-caption"><span>目标</span></div><div class="target" id="target" aria-label="目标星图"></div>
<div class="board-frame"><div class="board-halo"></div><div id="board" class="board" role="group" aria-label="九宫格拼图"></div><div id="anchors" class="anchors" aria-label="旋转节点"></div></div>
<p class="instruction" id="instruction" aria-live="polite"></p>
<div class="direction"><button class="selected" id="cwBtn">↻ 顺时针</button><button id="ccwBtn">↺ 逆时针</button></div>
<div class="tools"><button id="resetBtn">↺ 重开本局</button><button id="hintBtn">✧ 提示</button></div>
</section>
<div class="bottom-actions"><button class="share" id="shareBtn"><span>✦</span> 发起同题挑战</button><button class="secondary" id="nextBtn">下一关 <span>→</span></button></div>
</div>
</main>
<div class="overlay" id="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><button id="closeModal" class="close" aria-label="关闭弹窗">×</button><div class="dialog-emblem" id="dialogEmblem">✦</div><div class="eyebrow" id="dialogOverline">CHALLENGE COMPLETE</div><h2 id="dialogTitle">星图已复原</h2><p id="dialogText"></p><div class="dialog-stats" id="dialogStats"></div><button id="dialogPrimary" class="share">继续挑战</button><button id="dialogSecondary" class="text-btn">分享我的成绩</button></section></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js?v=0.2.2"></script>
</body></html>
