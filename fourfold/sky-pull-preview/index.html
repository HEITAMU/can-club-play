<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9dbb7"><meta name="description" content="拉住星空，松手回弹，把星星送回星座。一个只用拉和放的独立试玩。"><title>拽一下星空 · 独立试玩</title><link rel="icon" type="image/svg+xml" href="../assets/icon.svg"><link rel="preload" as="image" href="../starlight-preview/assets/tile-v1.webp"><link rel="stylesheet" href="style.css?v=1"></head><body>
<main class="page">
<header class="brand"><img src="../assets/art/home-title-starmap-v1.webp" width="1086" height="362" alt="星图有点乱"><span>独立试玩</span></header>
<div class="title-row"><div><h1>拽一下星空</h1><p>拉一下，松手，让星星回家。</p></div><button id="sound" class="sound" aria-label="关闭声音" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8q5 4 0 8M18.5 5q8 7 0 14"/></svg><span>声音</span></button></div>
