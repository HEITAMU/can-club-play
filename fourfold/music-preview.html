<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b2345"><title>月下回旋 · 四格诡局</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#171f3b;color:#f7e8c9;font:16px/1.6 system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:28px}main{width:min(100%,420px);padding:36px 28px;background:#202b4b;border:1px solid #6e624d;border-radius:24px;box-shadow:0 22px 70px #080e2350}small{color:#c8b386;letter-spacing:3px;font-size:12px}h1{font-size:36px;font-weight:550;margin:28px 0 6px;letter-spacing:5px}p{color:#c5c9d3;margin:0 0 24px}.disc{width:90px;height:90px;border:1px solid #c6aa74;border-radius:50%;margin-bottom:30px;background:radial-gradient(circle,#e7d09a 0 7px,#263455 8px 20px,#b29b6c 21px 22px,#263455 23px 32px,#8b7a58 33px 34px,#263455 35px);animation:spin 12s linear infinite;animation-play-state:paused}main.playing .disc{animation-play-state:running}@keyframes spin{to{transform:rotate(360deg)}}button{width:100%;border:0;border-radius:14px;padding:15px;background:#e9cf91;color:#242941;font-size:17px;font-weight:650;cursor:pointer}.time{font-variant-numeric:tabular-nums;color:#b7bdcf;text-align:right;font-size:13px;margin:9px 0 22px}progress{appearance:none;width:100%;height:3px;border:0;border-radius:3px;background:#38415d}progress::-webkit-progress-bar{background:#38415d}progress::-webkit-progress-value{background:#e9cf91}a{color:#d6c6a2;text-decoration:none;font-size:14px}footer{margin-top:24px;display:flex;justify-content:space-between}#status{font-size:13px;min-height:22px;color:#c6bda9;margin:12px 0 0}@media(prefers-reduced-motion:reduce){.disc{animation:none}}
</style></head><body><main id="panel"><div class="disc" aria-hidden="true"></div><small>四格诡局 · 原创背景音乐</small><h1>月下回旋</h1><p>轻轻摇摆，再转一格。</p><progress id="progress" max="76.8" value="0" aria-label="播放进度"></progress><div class="time"><span id="time">00:00</span> / 01:17 · 循环</div><button id="play" type="button">播放音乐</button><p id="status" aria-live="polite">点击播放，建议先用中等音量。</p><footer><a href="./index.html?v=0.8.38">返回游戏 →</a><span style="font-size:13px;color:#aeb7c9">100 BPM</span></footer></main>
<script type="module">
import {createBackgroundMusic} from './music.mjs?v=0.8.38';
const music=createBackgroundMusic({isVisible:()=>!document.hidden});
const play=document.querySelector('#play'),panel=document.querySelector('#panel'),status=document.querySelector('#status');let wanted=false;
const paint=()=>{const s=music.getState();panel.classList.toggle('playing',s.running);play.textContent=s.running?'暂停音乐':'播放音乐';document.querySelector('#progress').value=s.position;document.querySelector('#time').textContent=String(Math.floor(s.position/60)).padStart(2,'0')+':'+String(Math.floor(s.position%60)).padStart(2,'0');};
play.addEventListener('click',async()=>{if(music.getState().running){wanted=false;music.pause();status.textContent='已暂停';}else{wanted=true;const ok=await music.resume({gesture:true});status.textContent=ok?'正在播放 · 将自动循环':'播放尚未启动，请再点一次。';}paint();});
const timer=setInterval(paint,200);
document.addEventListener('visibilitychange',()=>{if(document.hidden)music.pause();else if(wanted)void music.resume().then(paint);paint();});
window.addEventListener('pagehide',event=>{music.pause();if(!event.persisted){clearInterval(timer);music.dispose();}});
window.addEventListener('pageshow',event=>{if(event.persisted&&wanted)void music.resume().then(paint);});
</script></body></html>
