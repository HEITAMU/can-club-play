<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>四格诡局 · 主页比例检查</title>
<style>
body{margin:0;padding:20px;background:#e7e3dc;color:#342b23;font:15px system-ui,sans-serif}header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}h1{font-size:20px;margin:0}select,button{font:inherit;padding:8px}output{padding:8px;border-radius:8px;background:#fff}iframe{display:block;border:0;box-shadow:0 0 0 2px #75634f,0 8px 30px #0002;margin:0 auto;background:#f8d4a5}main{overflow:auto;padding:4px 4px 20px}.pass{color:#176333}.fail{color:#a22621}
</style>
<header><h1>主页比例检查</h1><label>可用视口 <select id="size"><option value="390,650">390 × 650 · 内置浏览器短屏</option><option value="390,844">390 × 844 · 常规竖屏</option><option value="320,568">320 × 568 · 小屏</option><option value="460,936">460 × 936 · 桌面容器</option></select></label><button id="check">重新检查</button><output id="result">加载中…</output></header>
<main><iframe id="preview" title="真实游戏视口" width="390" height="650" src="../?v=0.7.2"></iframe></main>
<script>
const frame=document.querySelector('#preview'),size=document.querySelector('#size'),result=document.querySelector('#result');
function check(){
  const d=frame.contentDocument,w=frame.contentWindow;
  if(!d?.querySelector('.home-scene'))return;
  const art=d.querySelector('.home-scene').getBoundingClientRect(),home=d.querySelector('#home');
  if(home.hidden){result.textContent='请先返回游戏主页再检查';result.className='';return;}
  const ratios=[1114/198,1116/196,1122/196],buttons=[...d.querySelectorAll('.cozy-menu button')];
  const artOK=Math.abs(art.width/art.height-854/1840)<.002;
  const buttonsOK=buttons.every((b,i)=>{const r=b.getBoundingClientRect(),s=b.querySelector('.skin').getBoundingClientRect();return Math.abs(s.width/s.height-ratios[i])<.01&&r.height>=43.9&&r.left>=0&&r.right<=w.innerWidth+.5&&r.top>=0&&r.bottom<=w.innerHeight+.5;});
  const fit=art.left>=-.5&&art.top>=-.5&&art.right<=w.innerWidth+.5&&art.bottom<=w.innerHeight+.5;
  result.className=artOK&&buttonsOK&&fit?'pass':'fail';
  result.textContent=`${result.className==='pass'?'通过':'未通过'} · 原画 ${art.width.toFixed(1)} × ${art.height.toFixed(1)} · 按钮等比且可点 ${buttonsOK?'✓':'×'}`;
}
frame.addEventListener('load',()=>requestAnimationFrame(check));
size.addEventListener('change',()=>{const [width,height]=size.value.split(',');frame.width=width;frame.height=height;requestAnimationFrame(()=>requestAnimationFrame(check));});
document.querySelector('#check').addEventListener('click',check);
</script>
</html>
