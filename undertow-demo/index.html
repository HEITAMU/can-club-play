<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>逆潮之心｜网页试玩</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02101d;color:#e8ffff;font-family:system-ui;height:100%;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:24px;left:18px;right:18px;display:flex;justify-content:space-between;font-weight:bold;pointer-events:none}#help{position:absolute;bottom:28px;left:0;right:0;text-align:center;color:#b1e3e5;pointer-events:none}#screen{position:absolute;inset:0;background:#031726db;display:grid;place-items:center}#box{width:min(88vw,420px);background:linear-gradient(150deg,#14485b,#041c2c);border:1px solid #69e8e8;border-radius:20px;padding:28px;text-align:center;box-shadow:0 0 50px #2affde33}h1{font-size:35px;letter-spacing:5px}p{line-height:1.8}button{background:#72f7e6;color:#063543;border:0;border-radius:10px;padding:14px 20px;font-size:17px;font-weight:bold;margin:6px}small{color:#8db3bd}</style><canvas id="c"></canvas><div id="hud"><span id="wave">第 1 / 4 潮</span><span id="hp">潮心 100</span><span id="score">得分 0</span></div><div id="help">按住吸附 · 拖动瞄准 · 松手反弹</div><div id="screen"><div id="box"><h1 id="title">逆潮之心</h1><p id="desc">吸附深海异兽，再把它们反弹出去。<br>让敌人相互碰撞，守住潮心。</p><div id="buttons"><button id="go">开始试玩</button></div><small>独立 HTML5 玩法版 · 非 Cocos 构建包</small></div></div><script>
const C=document.querySelector('#c'),g=C.getContext('2d'),screen=document.querySelector('#screen'),T=document.querySelector('#title'),P=document.querySelector('#desc'),B=document.querySelector('#buttons');let w,h,u,cx,cy,mode='menu',wave=0,hp=100,score=0,time=0,spawn=0,held=false,charge=0,aim=-Math.PI/2,capacity=3,power=2,range=4.8,shock=0,boss=false,enemies=[],bullets=[],effects=[],last=0,ptr=null;const rand=Math.random;function resize(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio||1,2);C.width=w*d;C.height=h*d;g.setTransform(d,0,0,d,0,0);cx=w/2;cy=h*.5;u=Math.min(w/23,h/34)*2.5}onresize=resize;resize();function start(){mode='play';wave=0;hp=100;score=0;capacity=3;power=2;range=4.8;shock=0;newWave();screen.style.display='none'}function newWave(){mode='play';time=0;spawn=.4;boss=false;enemies=[];bullets=[];effects=[];held=false;document.querySelector('#wave').textContent='第 '+(wave+1)+' / 4 潮';screen.style.display='none'}function show(title,description,options){mode='pause';held=false;T.textContent=title;P.innerHTML=description;B.innerHTML='';options.forEach(([label,action])=>{const b=document.createElement('button');b.textContent=label;b.onclick=action;B.appendChild(b)});screen.style.display='grid'}document.querySelector('#go').onclick=start;function add(kind){const a=rand()*Math.PI*2,r=10.4;enemies.push({x:Math.cos(a)*r,y:Math.sin(a)*r,hp:kind==='boss'?24:kind==='armor'?3:1,kind,rad:kind==='boss'?1.1:.47,speed:kind==='boss'?.5:kind==='armor'?.8:1.1,held:false,alive:true,phase:rand()*7})}function fx(x,y,color){effects.push({x,y,color,t:0})}function hit(e,n){if(!e.alive)return;e.hp-=n;fx(e.x,e.y,'#8affef');if(e.hp<=0){e.alive=false;score+=e.kind==='boss'?250:10;fx(e.x,e.y,'#ffbc88');if(e.kind==='volatile')for(const f of enemies)if(f!==e&&f.alive&&!f.held&&Math.hypot(f.x-e.x,f.y-e.y)<2.8)hit(f,2)}}function release(){if(!held)return;held=false;const captured=enemies.filter(e=>e.alive&&e.held);captured.forEach((e,i)=>{e.alive=false;const a=aim+(i-(captured.length-1)/2)*.13;bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*11,vy:Math.sin(a)*11,ttl:2})});if(captured.length){fx(0,0,'#70ffe9');if(shock)enemies.forEach(e=>{if(e.alive&&!e.held&&Math.hypot(e.x,e.y)<3.5)hit(e,shock)})}charge=0}function pos(e){return{x:(e.clientX-cx)/u,y:(e.clientY-cy)/u}}C.onpointerdown=e=>{if(mode!=='play')return;ptr=e.pointerId;C.setPointerCapture(ptr);held=true;charge=0;let p=pos(e);if(Math.hypot(p.x,p.y)>.5)aim=Math.atan2(p.y,p.x)};C.onpointermove=e=>{if(!held||e.pointerId!==ptr)return;let p=pos(e);if(Math.hypot(p.x,p.y)>.5)aim=Math.atan2(p.y,p.x)};C.onpointerup=C.onpointercancel=e=>{if(e.pointerId===ptr){release();ptr=null}};function update(dt){if(mode!=='play')return;time+=dt;spawn-=dt;if(held){charge+=dt;if(charge>2.8){held=false;hp-=10;charge=0;enemies.forEach(e=>e.held=false);fx(0,0,'#ff6d65')}}if(wave===3&&!boss){add('boss');boss=true}if(spawn<=0&&time<([21,24,27,48][wave]-3)&&enemies.filter(e=>e.alive&&!e.held).length<13){const r=rand();add(wave===0?'normal':r<.24?'armor':r<.49?'volatile':'normal');spawn=Math.max(.6,1.5-wave*.15)}for(const e of enemies){if(!e.alive)continue;if(e.held){const list=enemies.filter(v=>v.held&&v.alive),a=time*3+list.indexOf(e)*Math.PI*2/list.length;e.x=Math.cos(a)*1.7;e.y=Math.sin(a)*1.7;continue}const d=Math.hypot(e.x,e.y);if(held&&e.kind!=='boss'&&!(e.kind==='armor'&&e.hp>1)&&d<range&&enemies.filter(v=>v.held&&v.alive).length<capacity){e.held=true;fx(e.x,e.y,'#71ffec');continue}e.x-=e.x/d*e.speed*dt;e.y-=e.y/d*e.speed*dt;if(d<1.4){hp-=e.kind==='boss'?18:9;e.alive=false;fx(0,0,'#ff6d65')}}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.ttl-=dt;for(const e of enemies){if(e.alive&&!e.held&&Math.hypot(e.x-b.x,e.y-b.y)<e.rad+.45){hit(e,power);b.ttl=0;break}}}enemies=enemies.filter(e=>e.alive);bullets=bullets.filter(b=>b.ttl>0&&Math.hypot(b.x,b.y)<12);effects.forEach(f=>f.t+=dt);effects=effects.filter(f=>f.t<.7);document.querySelector('#hp').textContent='潮心 '+Math.max(0,Math.ceil(hp));document.querySelector('#score').textContent='得分 '+score;if(hp<=0){show('潮心破碎','本次得分 '+score,[['重新挑战',start]]);return}if(wave===3){if(boss&&!enemies.some(e=>e.kind==='boss'))show('潮汐平息','成功守住潮心！<br>最终得分 '+score,[['再战一次',start]]);else if(time>48)show('潮心破碎','Boss 未能及时击败。<br>得分 '+score,[['再战一次',start]])}else if(time>[21,24,27][wave])show('潮汐间隙','选择一项进化，迎接下一波',[['扩大潮囊',()=>{capacity++;wave++;newWave()}],['增强反击',()=>{power++;wave++;newWave()}],['扩大吸附范围',()=>{range+=.7;wave++;newWave()}],['潮汐震荡',()=>{shock++;wave++;newWave()}]])}function draw(){const bg=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.8);bg.addColorStop(0,'#14516a');bg.addColorStop(.6,'#082a40');bg.addColorStop(1,'#010913');g.fillStyle=bg;g.fillRect(0,0,w,h);g.save();g.translate(cx,cy);for(let j=0;j<9;j++){const a=j*Math.PI*2/9+last*.00006;g.strokeStyle='#38a3b433';g.lineWidth=3;g.beginPath();g.moveTo(Math.cos(a)*u*1.5,Math.sin(a)*u*1.5);g.quadraticCurveTo(Math.cos(a+.3)*u*5,Math.sin(a+.3)*u*5,Math.cos(a)*u*13,Math.sin(a)*u*13);g.stroke()}g.restore();const r=u*1.15,grad=g.createRadialGradient(cx-r*.4,cy-r*.4,1,cx,cy,r*1.3);grad.addColorStop(0,'#ffffff');grad.addColorStop(.25,'#b3fff2');grad.addColorStop(.7,'#17aebf');grad.addColorStop(1,'#03425e');g.shadowColor='#5bffe8';g.shadowBlur=30;g.fillStyle=grad;g.beginPath();g.arc(cx,cy,r,0,7);g.fill();g.shadowBlur=0;if(held){g.strokeStyle='#77ffe788';g.setLineDash([6,8]);g.beginPath();g.arc(cx,cy,range*u,0,7);g.stroke();g.setLineDash([]);g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(aim)*u*8,cy+Math.sin(aim)*u*8);g.strokeStyle='#c8fff4';g.lineWidth=3;g.stroke()}for(const e of enemies){const x=cx+e.x*u,y=cy+e.y*u,rr=e.rad*u,col=e.kind==='boss'?'#f4b889':e.kind==='armor'?'#c1a7ff':e.kind==='volatile'?'#ff966e':'#62eddf';g.save();g.translate(x,y);g.rotate(Math.sin(last*.002+e.phase)*.16);g.strokeStyle=col+'99';g.lineWidth=Math.max(2,rr*.14);g.lineCap='round';for(let i=0;i<(e.kind==='boss'?9:6);i++){const a=i*Math.PI*2/(e.kind==='boss'?9:6);g.beginPath();g.moveTo(Math.cos(a)*rr*.5,Math.sin(a)*rr*.5);g.quadraticCurveTo(Math.cos(a+.3)*rr*1.5,Math.sin(a+.3)*rr*1.5,Math.cos(a+.2)*rr*1.9,Math.sin(a+.2)*rr*1.9);g.stroke()}const q=g.createRadialGradient(-rr*.3,-rr*.4,0,0,0,rr);q.addColorStop(0,'#f5fffa');q.addColorStop(.3,col);q.addColorStop(1,'#07364b');g.fillStyle=q;g.beginPath();g.ellipse(0,0,rr,rr*.83,0,0,7);g.fill();g.fillStyle='#062335';g.beginPath();g.arc(-rr*.25,-rr*.1,rr*.12,0,7);g.arc(rr*.25,-rr*.1,rr*.12,0,7);g.fill();if(e.held){g.strokeStyle='#f0fff9';g.lineWidth=2;g.beginPath();g.arc(0,0,rr*1.35,0,7);g.stroke()}g.restore()}for(const b of bullets){g.shadowColor='#7cfff1';g.shadowBlur=16;g.strokeStyle='#e0fff5';g.lineWidth=7;g.beginPath();g.moveTo(cx+(b.x-b.vx*.08)*u,cy+(b.y-b.vy*.08)*u);g.lineTo(cx+b.x*u,cy+b.y*u);g.stroke();g.shadowBlur=0}for(const f of effects){g.globalAlpha=1-f.t/.7;g.strokeStyle=f.color;g.lineWidth=3;g.beginPath();g.arc(cx+f.x*u,cy+f.y*u,u*(.3+f.t*3),0,7);g.stroke()}g.globalAlpha=1}function loop(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
