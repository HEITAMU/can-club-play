<!doctype html><meta charset="utf-8"><title>伙伴显示检查 · 0.26.20</title>
<style>body{margin:0;background:#252525;color:#eee;font:14px system-ui;display:flex;gap:20px;padding:20px}aside{width:400px}button{padding:10px;margin:5px}iframe{border:0;flex:none;background:#eee}pre{white-space:pre-wrap;font-size:12px}</style>
<aside><h1>伙伴显示检查</h1><p>独立测试存档。生产试玩存档不会被读写。</p><button id="run">运行三种手机尺寸检查</button><button id="profile">养成</button><button id="equipment">装备</button><button id="formation">阵容</button><pre id="log">等待开始</pre></aside>
<iframe id="game" width="390" height="844" src="preview-companions-v02620.html"></iframe>
<script type="module">
const frame=document.querySelector('#game'),log=document.querySelector('#log'),ids=['orange','ink','milk','spark','mint','bolt','pudding','star'],reports=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,click=s=>{const el=doc().querySelector(s);if(!el)throw Error('Missing '+s);el.click();};
async function wait(check){for(let i=0;i<180;i++){if(check())return;await sleep(50);}throw Error('Timed out');}
function assert(value,message){if(!value)throw Error(message);}
function sprite(selector){const e=doc().querySelector(selector),r=e.getBoundingClientRect(),c=e.querySelector('canvas'),d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let hash=2166136261,pixels=0;for(let i=0;i<d.length;i+=4){if(d[i+3]>50)pixels++;hash=Math.imul(hash^d[i]^d[i+1]^d[i+2]^d[i+3],16777619);}return{width:r.width,height:r.height,canvas:[c.width,c.height],hash,pixels};}
for(const mode of ['profile','equipment','formation'])document.querySelector('#'+mode).onclick=()=>{click('[data-tab="cats"]');click('[data-crew-mode="'+mode+'"]');};
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;reports.length=0;
 try{
  for(const [width,height] of [[320,568],[430,932],[390,844]]){
   log.textContent='检查中：'+width+' × '+height;frame.width=width;frame.height=height;frame.src='preview-companions-v02620.html?width='+width;
   await new Promise(r=>frame.onload=r);await wait(()=>doc().querySelector('#actor-p0 .rig-ready'));
   const unit=parseFloat(frame.contentWindow.getComputedStyle(doc().documentElement).getPropertyValue('--companion-unit')),figures=[];
   assert(Math.abs(sprite('#actor-p0 .companion-body').width-unit)<.03,'战场尺寸');
   click('[data-tab="cats"]');
   for(const id of ids){
    click('[data-crew-mode="profile"]');click('[data-crew="'+id+'"]');doc().querySelector('.crew-portrait').scrollIntoView({block:'center'});
    await wait(()=>doc().querySelector('.crew-portrait .rig-ready'));let a=sprite('.crew-portrait .companion-body');await sleep(650);let b=sprite('.crew-portrait .companion-body');
    assert(Math.abs(a.width-unit*(id==='pudding'?1.22:1))<.03,id+' 养成尺寸');assert(a.pixels>100&&a.hash!==b.hash,id+' 养成动态 '+JSON.stringify({a,b,hidden:doc().hidden}));
    click('[data-crew-mode="equipment"]');await wait(()=>doc().querySelector('.equipment-character .rig-ready'));let c=sprite('.equipment-character .companion-body');await sleep(650);let d=sprite('.equipment-character .companion-body');
    assert(Math.abs(a.width-c.width)<.03,id+' 装备尺寸');assert(JSON.stringify(a.canvas)===JSON.stringify(c.canvas),id+' 画布比例');assert(c.pixels>100&&c.hash!==d.hash,id+' 装备动态');
    figures.push({id,width:a.width,canvas:a.canvas,profileAnimated:true,equipmentAnimated:true});log.textContent='检查中：'+width+' × '+height+'\n'+figures.map(e=>e.id+'：'+e.width.toFixed(2)+'px，养成 / 装备动态通过').join('\n');
   }
   const list=doc().querySelector('.equipment-bag .gear-list');list.scrollTop=list.scrollHeight;assert(list.scrollTop>0,'背包滑动');
   const drawer={top:list.scrollTop,height:list.clientHeight,total:list.scrollHeight};
   click('[data-crew-mode="formation"]');await wait(()=>doc().querySelectorAll('.formation-board .rig-ready').length===5);
   const standing=[...doc().querySelectorAll('.formation-board .companion-body')].map(e=>({id:e.dataset.art,width:e.getBoundingClientRect().width}));
   for(const e of standing)assert(Math.abs(e.width-unit*(e.id==='pudding'?1.22:1))<.03,e.id+' 阵容尺寸');
   const a=sprite('.formation-board .companion-body');await sleep(700);assert(a.hash!==sprite('.formation-board .companion-body').hash,'阵容动态');
   assert(doc().documentElement.scrollWidth<=width,'页面横向溢出');
   reports.push({width,height,unit,figures,drawer,standing,formationAnimated:true});
  }
  log.textContent='全部通过\n'+JSON.stringify(reports,null,2);document.body.dataset.result='pass';
 }catch(e){log.textContent='检查失败：'+e.message;document.body.dataset.result='fail';}
 document.querySelector('#run').disabled=false;
};
</script>
