<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>罐头远征队 · 全队动作对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#293e43;color:#f7dfb3;font:16px system-ui;max-width:460px;margin:auto;padding:22px 16px}h1{font-size:25px;margin:4px 0 8px}p{color:#c8c7af;line-height:1.6;font-size:14px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,select{font:inherit;color:#f5dfb4;background:#654f4d;border:1px solid #af9270;border-radius:10px;padding:10px 15px}button[aria-pressed=true]{background:#b78042;color:#241d18}.stage{background:radial-gradient(ellipse at 50% 100%,#8d7855,#405956 70%);border:2px solid #af9270;border-radius:18px;overflow:hidden;position:relative;margin:14px 0}.label{position:absolute;top:12px;left:14px;font-size:15px}.scene{position:relative;height:230px;overflow:hidden}.hero{position:absolute;width:200px;height:192px;left:0;bottom:4px}.target{position:absolute;right:24px;bottom:36px;width:48px;height:62px;border:4px solid #65482d;border-radius:35% 35% 20% 20%;background:repeating-linear-gradient(90deg,#b99b6d 0 8px,#a7885d 8px 10px);box-shadow:0 10px 10px #182c3655}.target:after{content:'✦';position:absolute;inset:5px;text-align:center;font-size:34px;color:#69472c}.fx{position:absolute;width:20px;height:20px;background:#ffd287;border-radius:50%;box-shadow:0 0 14px #ff9c45;opacity:0}.floor{position:absolute;bottom:23px;left:10%;right:6%;height:3px;background:#e2c69a44}.stats{padding:8px 14px;background:#263b3ddd;font-size:12px;color:#c9c9b5}.readout{display:flex;justify-content:space-between;font-size:13px}input{width:100%;accent-color:#dbac61}a{color:#edc67f}
</style></head><body><h1>罐头远征队 · 全队动作对照</h1><p>八名现有伙伴 · 同一原画、同一动作时序，新旧过渡对照。</p><nav><button data-id="orange" aria-pressed="true">橘座</button><button data-id="ink" aria-pressed="false">阿墨</button><button data-id="milk" aria-pressed="false">奶盖</button><button data-id="mint" aria-pressed="false">薄荷</button><button data-id="bolt" aria-pressed="false">扳手</button><button data-id="pudding" aria-pressed="false">石墩</button><button data-id="star" aria-pressed="false">星斑</button><button data-id="spark" aria-pressed="false">火花</button><select id="kind" aria-label="动作"><option value="normal">普攻</option><option value="skill">技能</option></select><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value=".5">半速观察</option></select><button id="pause">暂停</button></nav><div class="stage"><span class="label">更新前</span><div class="scene" id="old"><div class="floor"></div><canvas class="hero" width="400" height="384"></canvas><div class="target"></div><div class="fx"></div></div><div class="stats" id="oldStats">加载原画…</div></div><div class="stage"><span class="label">本版 · 缩短叠影过渡</span><div class="scene" id="new"><div class="floor"></div><canvas class="hero" width="400" height="384"></canvas><div class="target"></div><div class="fx"></div></div><div class="stats" id="newStats">加载原画…</div></div><div class="readout"><span id="phase">准备</span><span id="hit">本次命中：0 / 1</span></div><input id="seek" aria-label="动作进度" type="range" min="0" max="1000" value="0"><p>本版保留现有原画和动作时长，缩短相邻姿势的重叠显示。扳手、石墩已有专用短过渡，保留其时长。耗时仅为当前浏览器 CPU 绘制时间；本页不读取或修改存档。</p><a href="./">返回游戏</a><script type="module" src="./motion-review.mjs"></script></body></html>
