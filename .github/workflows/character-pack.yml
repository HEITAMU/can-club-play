name: Character pack review
on:
  push:
    branches: [character-pack/batch01-v2]
    paths: ['character-packs/**', '.github/workflows/character-pack.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wechat/package-lock.json
      - run: npm ci --prefix wechat
      - run: ln -s wechat/node_modules node_modules
      - run: wechat/node_modules/.bin/playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - run: node --test character-packs/batch01/test.mjs character-packs/batch01/shield-punch.test.mjs character-packs/batch01/anatomy-upgrade.test.mjs
      - run: node character-packs/batch01/browser-review.mjs
      - name: Render review images and motion
        run: node character-packs/batch01/review.mjs --video
      - name: Package reviewed character assets
        run: |
          cp qa/batch01-browser/report.json character-packs/batch01/review/browser-report.json
          cp qa/batch01-browser/xuanyue-390.png character-packs/batch01/review/browser-mobile.png
          zip -q -r can-club-character-pack-01.zip character-packs/batch01 docs/roster-50-proposal-v1.json docs/roster-50-proposal-v1.md docs/rollback-baseline-v0210.json -x '*/review/*.mp4'
      - uses: actions/upload-artifact@v4
        with:
          name: character-pack-01-v02-reviewed
          path: |
            can-club-character-pack-01.zip
            character-packs/batch01/review/
      - name: Save verification evidence on the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f character-packs/batch01/review character-packs/batch01/assets/portraits.webp can-club-character-pack-01.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Save verified first-ten character pack and review evidence [skip ci]'
            git push origin HEAD:character-pack/batch01-v2
          fi
