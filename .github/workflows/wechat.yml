name: WeChat test build
on:
  push:
    branches: [wechat-test-v0210]
    paths-ignore: ["dist/**", "wechat-review/**", "*.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wechat/package-lock.json
      - run: npm ci --prefix wechat
      - run: wechat/node_modules/.bin/playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run build --prefix wechat
      - run: npm test --prefix wechat
      - run: npm run review --prefix wechat
      - run: node wechat/tests/browser-review.mjs
      - name: Attach test project and rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: can-club-wechat-v0.21.0
          path: |
            dist/wechat/
            qa/wechat-review/
            qa/wechat-browser/
      - name: Make verified project directly downloadable
        if: github.ref_name == 'wechat-test-v0210'
        run: |
          mkdir -p wechat-review
          cp qa/wechat-browser/report.json wechat-review/browser-report.json
          cp qa/wechat-browser/battle-390.png qa/wechat-browser/crew-390.png qa/wechat-browser/formation-390.png wechat-review/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          (cd dist/wechat && zip -q -r ../../can-club-wechat-v0.21.0.zip .)
          git add -f can-club-wechat-v0.21.0.zip wechat-review
          if ! git diff --cached --quiet; then
            git commit -m 'Package verified WeChat test project [skip ci]'
            git push origin HEAD:wechat-test-v0210
          fi
