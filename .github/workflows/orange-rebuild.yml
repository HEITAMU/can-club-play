name: Orange character in-game review
on:
  push:
    branches: [rebuild/main-characters-v0220]
    paths-ignore: ['docs/review/orange-v0220/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wechat/package-lock.json
      - run: npm ci --prefix wechat
      - run: ln -s wechat/node_modules node_modules
      - run: wechat/node_modules/.bin/playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - run: npm run build --prefix wechat
      - run: npm test --prefix wechat
      - run: node scripts/review-rebuild.mjs
      - run: node scripts/browser-orange-review.mjs
      - name: Preserve review evidence
        run: |
          mkdir -p docs/review/orange-v0220
          cp qa/rebuild/orange-hands.png qa/orange-browser/*.png qa/orange-browser/*.json qa/orange-browser/*.mp4 docs/review/orange-v0220/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/review/orange-v0220
          if ! git diff --cached --quiet; then
            git commit -m 'Save orange in-game review evidence [skip ci]'
            git push origin HEAD:rebuild/main-characters-v0220
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: orange-v0220-in-game-review
          path: docs/review/orange-v0220/
