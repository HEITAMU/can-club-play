<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#493640"><meta name="description" content="带上五只猫，拿下一条街。原创轻量放置冒险：自动战斗、阵容搭配、首领战利品和离线鱼摊。"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="game.bundle.css?v=0.26.4"><title>罐头远征队 · 猫猫放置冒险</title>
</head><body>
<div class="desktop-copy"><div class="studio">MIDNIGHT CAN CLUB</div><h1>罐头<br><span>远征队</span></h1><p>带上五只猫，<br>拿下一条街。</p><div id="desktop-cat"></div><div class="desktop-note">自动出击 · 自由搭配<br>累了就歇会儿，鱼摊还在营业。</div><span class="build-label">0.26.4</span></div>
<div class="game-shell"><main id="main"><section id="battle-view"><div class="chapterbar"><div><span class="chapter-kicker" id="chapter-kicker">CHAPTER 01 / 06</span><h2 id="chapter-name">晒鱼天台</h2></div><button class="stage-chip" id="stage-map" aria-label="查看街区关卡"><span id="stage-prefix">第</span> <b id="stage-number">1</b> <span id="stage-unit">关</span> <span>›</span></button></div><div class="chapter-track" id="chapter-track"></div>
<section id="boss-hud" class="boss-hud" aria-label="首领状态" hidden><div class="boss-heading"><span class="boss-kicker">街头首领</span><b id="boss-name"></b><span id="boss-health"></span></div><div class="boss-health-track" aria-hidden="true"><i id="boss-health-fill"></i></div><div class="boss-cue"><span id="boss-warning" role="status" aria-live="polite">留意蓄力，开罐啦可以打断</span><b id="boss-countdown" aria-hidden="true"></b></div><div class="boss-charge-track" aria-hidden="true"><i id="boss-charge-fill"></i></div></section>
<div class="arena" id="arena"><div id="scene"></div><div class="arena-badges"><span id="battle-label">街区巡逻</span><span id="battle-time">准备出发</span></div><div class="arena-sides" aria-hidden="true"><span>伙伴</span><i>VS</i><span>街头对手</span></div><div id="combat-effects" aria-hidden="true"></div><div id="actors"></div><div id="fx" aria-hidden="true"></div><div id="battle-message" class="battle-message"></div><div class="scene-caption" id="scene-caption">从自家屋顶，守到整条街。</div></div>
<div class="actionbar"><button class="battle-start" id="battle-start">出发巡逻</button><button class="can-button" id="open-can" aria-label="开罐啦：全队回血百分之二十、攻击敌人并打断蓄力，不耗鱼币" aria-describedby="can-sub can-status"><span id="can-icon"></span><span><b id="can-label">开罐啦</b><small id="can-sub">回血20% · 伤敌 · 打断</small></span><span id="can-status" class="can-status">开战可用</span><span class="can-progress-track" aria-hidden="true"><i id="can-progress"></i></span></button><button class="speed-button" id="speed">×1</button></div>
<p id="rescue-tip" hidden></p>
<div class="battle-options"><button id="farm" class="text-btn">去练练 · 旧关刷币</button><span id="power" class="power"></span></div>
<button class="objective" id="objective"><span class="objective-mark">!</span><span id="objective-text">第一单：赢得一场战斗</span><span>›</span></button></section>
<section id="other-view" hidden></section></main>
<div class="resourcebar utility-bar" aria-label="资源与工具"><div class="currency"><span id="coin-icon"></span><b id="gold">200</b><span>鱼币</span></div><div class="currency bones"><span id="bone-icon"></span><b id="bones">0</b><span>徽章</span></div></div>
<div id="district-tools" class="district-tools" hidden><button id="quests" class="quest-btn" aria-label="成长清单"><span id="quest-icon"></span><span>成长清单</span><i id="quest-dot" hidden></i></button><button class="round-btn" id="settings" aria-label="设置与存档"></button></div>
<nav class="bottom-nav" aria-label="游戏菜单"><button data-tab="battle" class="active"><span></span><b>出战</b></button><button data-tab="cats"><span></span><b>伙伴</b><i id="cats-count">2/8</i></button><button data-tab="relics"><span></span><b>背包</b></button><button data-tab="map"><span></span><b>街区</b></button></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div><div id="save-warning" class="save-warning" hidden>当前浏览器无法保存进度，请在设置中导出存档。</div>
</div>
<div id="modal-backdrop" class="modal-backdrop" hidden><section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><button class="modal-close" id="modal-close" aria-label="关闭弹窗"></button><div id="modal-content"></div></section></div>
<noscript>请使用支持 JavaScript 的浏览器打开游戏。</noscript><div id="boot-status" role="status" style="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:300;background:#493640;color:#f8e8c6;padding:10px 16px;border-radius:10px;font:14px system-ui;white-space:nowrap">正在准备猫巷…</div><script type="module" src="game.bundle.mjs?v=0.26.4" onerror="document.getElementById('boot-status').textContent='游戏加载中断，请重新打开本页'"></script></body></html>
