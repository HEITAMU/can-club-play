<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战场分区回归</title><link rel="stylesheet" href="game.bundle.css?v=0.26.48"><style>body{display:block;padding:8px}.check{margin:auto;width:390px}nav{display:flex;flex-wrap:wrap;gap:4px;padding:5px}nav button{padding:8px;background:#d2ad70;color:#493b32}.arena{position:relative;width:390px!important;height:600px!important;min-height:0!important;flex:none!important}#scene{position:absolute;inset:0}#arena.short{height:460px!important}#arena.tall{height:760px!important}</style><div class="check"><nav><button data-shape="short">短屏</button><button data-shape="">标准</button><button data-shape="tall">长屏</button></nav><nav><button data-scene="sweep">雨巷</button><button data-scene="escort">码头</button><button data-scene="salvage">仓库</button><button data-scene="recruit">庭院</button><button data-scene="hunt">铁路</button><button data-scene="hard">冷库</button><button data-scene="normal">普通关</button></nav><div id="arena" class="arena"><div id="scene"></div><div id="actors"></div></div></div><script type="module">
import {commissionScene,sceneSVG,catSVG,setPose} from './art.mjs';import {groundFootY} from './battlefield-space.mjs';import {battleUnitSize,companionSize} from './companion-display.mjs';import {watchImageAssets} from './image-cache.mjs';import {paintRain} from './scene-weather.mjs';
const arena=document.querySelector('#arena'),scene=document.querySelector('#scene'),actors=document.querySelector('#actors');let kind='sweep',unit=58;
function render(){scene.innerHTML=kind==='normal'?sceneSVG(0):commissionScene({kind});const h=arena.clientHeight-76;unit=battleUnitSize(390,h);actors.innerHTML=['orange','pudding','milk','ink','spark'].map((id,i)=>{const row=[59,89,51,73,95][i],x=[36,36,16,22,16][i];return `<div class="actor" style="left:${x}%;top:${groundFootY(row,h,unit)}%;--actor-size:${companionSize(unit,id)}px"><span class="ground-shadow"></span><div class="actor-body">${catSVG(id)}</div></div>`}).join('');}
document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{arena.className='arena '+b.dataset.shape;render();});document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{kind=b.dataset.scene;render();});render();watchImageAssets();function frame(t){requestAnimationFrame(frame);for(const e of actors.querySelectorAll('.actor-body')){const id=e.querySelector('[data-art]')?.dataset.art;setPose(e,0,{time:t/1000,idleTime:t/1000,renderSize:companionSize(unit,id)});}const rain=scene.querySelector('canvas');if(rain)paintRain(rain,t/1000,unit);}requestAnimationFrame(frame);
</script>
